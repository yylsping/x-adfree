import java.util.Properties

plugins {
    id "com.android.application"
}

def signingPropertiesFile = rootProject.file("signing-private/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "io.github.yylsping.xadfree"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.yylsping.xadfree"
        minSdk 28
        targetSdk 35
        versionCode 21
        versionName "2.0.2"
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingPropertiesFile.isFile() ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            merges += "META-INF/xposed/*"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
    // DexKit query APIs reference Kotlin types (Function1/Unit) in their
    // signatures; javac only needs the stdlib on the compile classpath.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.5.0"
    implementation "org.luckypray:dexkit:2.0.6"
    testImplementation "io.github.libxposed:api:102.0.0"
    testImplementation "junit:junit:4.13.2"
    // Real org.json for unit tests: the android.jar stub returns defaults
    // (null) from JSONObject methods, which would silently break every
    // cache serialization test.
    testImplementation "org.json:json:20240303"
}
